name = "jarvis-api"
main = "src/index.js"
compatibility_date = "2026-10-31"

[vars]
JARVIS_ENV = "production"
FISH_VOICE_ID = "612b878b113047d9a770c069c8b4fdfe"
FISH_MODEL = "s2.1-pro-free"
GEMINI_MODEL = "gemini-2.5-flash"
SUPABASE_URL = "https://agwaxaejnnszunccmftm.supabase.co"
LOG_LEVEL = "info"

[[kv_namespaces]]
binding = "DEVICE_REGISTRY"
id = "9d3eb996a9d643eca41bf4f46be73fcc"

[[kv_namespaces]]
binding = "DEVICE_COMMANDS"
id = "58bc583f2c684c349c5beef542fd1954"

[env.staging]
name = "jarvis-api-staging"
[env.staging.vars]
JARVIS_ENV = "staging"
FISH_VOICE_ID = "612b878b113047d9a770c069c8b4fdfe"
FISH_MODEL = "s2.1-pro-free"
GEMINI_MODEL = "gemini-2.5-flash"
SUPABASE_URL = "https://agwaxaejnnszunccmftm.supabase.co"
LOG_LEVEL = "info"

# Provision separate staging KV namespaces before enabling stateful staging tests.
# Never reuse production namespace IDs in non-production environments.

[env.development]
name = "jarvis-api-dev"
[env.development.vars]
JARVIS_ENV = "development"
FISH_VOICE_ID = "612b878b113047d9a770c069c8b4fdfe"
FISH_MODEL = "s2.1-pro-free"
GEMINI_MODEL = "gemini-2.5-flash"
SUPABASE_URL = "https://agwaxaejnnszunccmftm.supabase.co"
LOG_LEVEL = "debug"

# Local development uses local KV emulation. Provision dedicated remote namespaces
# before deploying the development environment to Cloudflare.