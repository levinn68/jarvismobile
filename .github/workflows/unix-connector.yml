name: JARVIS macOS and Linux Connector Tests
on:
  pull_request:
    branches: [main]
    paths:
      - "desktop/unix/**"
      - ".github/workflows/unix-connector.yml"
  push:
    branches: [main]
    paths:
      - "desktop/unix/**"
      - ".github/workflows/unix-connector.yml"
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check connector syntax
        working-directory: desktop/unix
        run: node --check src/agent.js
      - name: Test folder access boundaries
        working-directory: desktop/unix
        run: node --test test/*.test.js