name: Deploy JARVIS Cloudflare Worker
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Validate required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          DEVICE_ENROLLMENT_SECRET: ${{ secrets.DEVICE_ENROLLMENT_SECRET }}
          DEVICE_TOKEN_SECRET: ${{ secrets.DEVICE_TOKEN_SECRET }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$FISH_API_KEY"
          test -n "$DEVICE_ENROLLMENT_SECRET"
          test -n "$DEVICE_TOKEN_SECRET"
          test "${#DEVICE_ENROLLMENT_SECRET}" -ge 32
          test "${#DEVICE_TOKEN_SECRET}" -ge 32
      - name: Configure Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          DEVICE_ENROLLMENT_SECRET: ${{ secrets.DEVICE_ENROLLMENT_SECRET }}
          DEVICE_TOKEN_SECRET: ${{ secrets.DEVICE_TOKEN_SECRET }}
        run: |
          set -eu
          printf '%s' "$FISH_API_KEY" | wrangler secret put FISH_API_KEY --name jarvis-api
          printf '%s' "$DEVICE_ENROLLMENT_SECRET" | wrangler secret put DEVICE_ENROLLMENT_SECRET --name jarvis-api
          printf '%s' "$DEVICE_TOKEN_SECRET" | wrangler secret put DEVICE_TOKEN_SECRET --name jarvis-api
      - name: Configure optional SerpApi visual search
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          if [ -n "$SERPAPI_API_KEY" ]; then
            printf '%s' "$SERPAPI_API_KEY" | wrangler secret put SERPAPI_API_KEY --name jarvis-api
          else
            echo "SERPAPI_API_KEY not set; visual search remains disabled."
          fi
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler deploy worker/src/index.js --name jarvis-api --compatibility-date 2026-10-31 --var FISH_VOICE_ID:612b878b113047d9a770c069c8b4fdfe --var FISH_MODEL:s2.1-pro-free
