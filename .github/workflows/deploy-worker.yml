name: Deploy JARVIS Cloudflare Worker
on:
  push:
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run device platform tests
        run: npm test --prefix worker
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Configure Fish Audio voice secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$FISH_API_KEY"
          printf '%s' "$FISH_API_KEY" | wrangler secret put FISH_API_KEY --name jarvis-api
      - name: Configure Supabase session verification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            printf '%s' "$SUPABASE_ANON_KEY" | wrangler secret put SUPABASE_ANON_KEY --name jarvis-api
          else
            echo "SUPABASE_ANON_KEY missing; Google-linked device enrollment remains disabled."
          fi
      - name: Configure optional SerpApi visual search
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          if [ -n "$SERPAPI_API_KEY" ]; then
            printf '%s' "$SERPAPI_API_KEY" | wrangler secret put SERPAPI_API_KEY --name jarvis-api
          else
            echo "SERPAPI_API_KEY not set; visual search remains disabled."
          fi
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler deploy --config worker/wrangler.toml
