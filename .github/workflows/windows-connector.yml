name: JARVIS Windows Connector Tests
on:
  pull_request:
    branches: [main]
    paths:
      - "desktop/windows/**"
      - ".github/workflows/windows-connector.yml"
  push:
    branches: [main]
    paths:
      - "desktop/windows/**"
      - ".github/workflows/windows-connector.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check connector syntax
        working-directory: desktop/windows
        run: node --check src/agent.js
      - name: Test folder access boundaries
        working-directory: desktop/windows
        run: node --test test/*.test.js
