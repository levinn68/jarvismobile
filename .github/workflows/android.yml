name: Build J.A.R.V.I.S. Android Client
on:
  push:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "JarvisMobile-source.zip"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "JarvisMobile-source.zip"
      - ".github/workflows/android.yml"
  workflow_dispatch:
concurrency:
  group: jarvis-android-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Google OAuth & Supabase configuration
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::warning::GOOGLE_WEB_CLIENT_ID is not configured in GitHub Secrets. The APK will compile and allow runtime Web Client ID configuration in J.A.R.V.I.S. Settings/Account dialog, or set GOOGLE_WEB_CLIENT_ID in repository secrets."
          elif echo "$GOOGLE_WEB_CLIENT_ID" | grep -Eq '^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$'; then
            echo "GOOGLE_WEB_CLIENT_ID format verified (OAuth 2.0 Web Client ID)."
          else
            echo "::error::GOOGLE_WEB_CLIENT_ID does not match <project>-<hash>.apps.googleusercontent.com. Ensure you use the Web application Client ID, not the Android Client ID."
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::SUPABASE_ANON_KEY secret not set; using build.gradle.kts public publishable key fallback."
          fi
      - name: Locate Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Accept licenses and install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Print APK OAuth fingerprint
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK"
          echo "Register this SHA-1 in Google Cloud as an Android OAuth client for package com.jarvis.mobile.assistant."
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
