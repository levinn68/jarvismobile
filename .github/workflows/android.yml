name: Build J.A.R.V.I.S. Android Client
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JARVIS_KEYSTORE_FILE: ${{ github.workspace }}/jarvis-release.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore and validate permanent release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64, os, re, sys
          raw = os.environ.get("KEYSTORE_BASE64", "")
          compact = re.sub(r"\s+", "", raw)
          if not compact:
              sys.exit("KEYSTORE_BASE64 is empty. Re-enter the complete Base64 text in GitHub Secrets.")
          try:
              decoded = base64.b64decode(compact, validate=True)
          except Exception:
              sys.exit("KEYSTORE_BASE64 is not valid Base64. Copy the complete contents of jarvis-final.txt, without labels or extra text.")
          if len(decoded) < 1000:
              sys.exit("Decoded keystore is unexpectedly small. Check that the full Base64 value was pasted.")
          with open(os.environ["JARVIS_KEYSTORE_FILE"], "wb") as f:
              f.write(decoded)
          print(f"Base64 decoded successfully ({len(decoded)} bytes).")
          PY
          keytool -list -keystore "$JARVIS_KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Keystore file and alias validated successfully."
      - name: Locate Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Accept licenses and install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build signed release APK
        run: gradle assembleRelease --stacktrace
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-release-v0.5.0
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish latest Android update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk jarvis.apk
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest jarvis.apk --clobber
            gh release edit android-latest --title "J.A.R.V.I.S build 5" --notes "Latest signed J.A.R.V.I.S Android update. Build code: 5."
          else
            gh release create android-latest jarvis.apk --title "J.A.R.V.I.S build 5" --notes "Latest signed J.A.R.V.I.S Android update. Build code: 5."
          fi
