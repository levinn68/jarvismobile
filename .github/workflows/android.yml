name: Build JARVIS Mobile APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JARVIS_KEYSTORE_FILE: ${{ github.workspace }}/jarvis-release.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore permanent release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$JARVIS_KEYSTORE_FILE"
          test -s "$JARVIS_KEYSTORE_FILE"
      - name: Locate Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Accept licenses and install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build signed release APK
        run: gradle assembleRelease --stacktrace
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvismobile-release-v0.5.0
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
