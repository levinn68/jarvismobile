name: JARVIS Device Platform Tests
on:
  pull_request:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/device-platform-tests.yml"
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/device-platform-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run device platform tests
        working-directory: worker
        run: npm test
