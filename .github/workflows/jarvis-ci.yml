name: J.A.R.V.I.S. Pull Request Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: ["feat/**"]
permissions:
  contents: read
jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Worker tests
        run: npm test --prefix worker
